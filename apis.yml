name: Plinth US Grants Data
description: >-
  A JSON API over the entire US grantmaking universe — about 205,000 grantmaking foundations and
  17.9 million grants, read from public IRS Form 990, 990-EZ and 990-PF e-file filings and the IRS
  Business Master File. The funder-grantee graph traverses in both directions: filter by funder_id
  for everything a foundation funded, or by recip_id for every funder behind a nonprofit. Offers
  REST endpoints for grants, organization profiles, an IRS compliance and OFAC screen, an ad-hoc
  read-only SQL endpoint over a 31-table warehouse, and a hosted OAuth 2.1 MCP connector for AI
  agents. Entity resolution is free and unmetered. Published by Plinth, trading name of Time to
  Spare Ltd (UK Companies House 11530023), which also operates plinth.org.uk in the UK.

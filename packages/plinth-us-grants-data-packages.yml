source: >-
  Registry sweeps of npm (registry.npmjs.org search), PyPI, RubyGems, crates.io, NuGet, pkg.go.dev
  and Maven Central for a first-party Plinth client library, plus the provider's own developer
  documentation (https://data.useplinth.com/developers), llms.txt, APIs.json 0.19 index and API
  Onboarding Descriptor. No first-party SDK is published in any registry, and none is referenced
  from any Plinth-published artifact.
checked: '2026-08-14'
summary:
  first_party_sdk_count: 0
  third_party_package_count: 0
  note: >-
    Plinth publishes NO client library in any public package registry as of 2026-08-14. The
    provider's integration story is deliberately raw-HTTP: a single curl-shaped REST surface behind
    an X-API-Key header, plus a hosted MCP connector for agents. The developer page shows curl
    exclusively; the APIs.json index declares 16 properties on the REST API and not one of them is
    an SDK, SourceCode or Repository link. Because no official SDK exists, this repo emits NO
    `SDKs` pointer — the ergonomics sdk_count check must read a genuine zero here.
  what_stands_in_for_an_sdk: >-
    The OpenAPI 3.1 description at /openapi.json is generated from the service's own route
    signatures and is linted against a published Spectral ruleset, so a generated client is the
    intended path. The provider says so on the developer page: "point a client generator, an HTTP
    client, or an AI agent at it rather than reading prose."


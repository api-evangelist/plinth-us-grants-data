confidence_note: >-
  The docs host is server-rendered and was captured verbatim by curl (90KB of real HTML, not an SPA
  shell), so every number below is quoted from the provider's own page rather than inferred. The
  headers were NOT observed on a live response because the only unauthenticated operation
